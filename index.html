<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unit 5: Methane Molecule - Interactive 3D Model | Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Montserrat', 'Arial', sans-serif;
        }

        /* Info overlay - subtle and modern */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 20px;
            color: #f0f0f0;
            pointer-events: none;
            z-index: 10;
            border-left: 4px solid #00cc66;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .info-panel h1 {
            margin: 0 0 4px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .info-panel p {
            margin: 0;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .controls-tip {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            color: #ccc;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .info-panel { padding: 8px 14px; }
            .info-panel h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h1>🧪 Methane (CH₄)</h1>
        <p>Tetrahedral structure | Carbon (red) • Hydrogen (blue) | Bonds with light emissive glow</p>
    </div>
    <div class="controls-tip">
        🖱️ Drag to rotate | Scroll to zoom
    </div>

    <!-- Import Map for Three.js core and add-ons -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ==========================================
        // 1. SCENE, CAMERA & RENDERERS
        // ==========================================
        // WebGL Renderer for 3D objects with shadows
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a); // deep space / dark blue-black
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008); // subtle fog for depth

        // Perspective Camera: optimal view for molecule
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3, 2.5, 5.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;          // CRITICAL: enable shadows globally
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // soft shadow edges
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Optional CSS2DRenderer for minimal labels (adds educational touch without clutter)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // ==========================================
        // 2. LIGHTING SYSTEM (Dynamic & Atmospheric)
        // ==========================================
        // Ambient light: even illumination for base colors
        const ambientLight = new THREE.AmbientLight(0x404060, 0.55);
        scene.add(ambientLight);

        // Main directional light (key light) for sharp shadows
        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.3);
        mainLight.position.set(4, 6, 3);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 10;
        mainLight.shadow.camera.left = -5;
        mainLight.shadow.camera.right = 5;
        mainLight.shadow.camera.top = 5;
        mainLight.shadow.camera.bottom = -5;
        scene.add(mainLight);

        // Fill light from below and back to lift shadows on the molecule
        const fillLight = new THREE.PointLight(0x4466cc, 0.45);
        fillLight.position.set(0, -1.5, 1);
        fillLight.castShadow = false;
        scene.add(fillLight);

        // Rim/Back light to highlight edges of atoms (adds depth)
        const rimLight = new THREE.PointLight(0xffaa66, 0.6);
        rimLight.position.set(-2, 1.5, -3);
        rimLight.castShadow = false;
        scene.add(rimLight);

        // Soft fill from the side for extra realism
        const softFill = new THREE.PointLight(0x88aaff, 0.35);
        softFill.position.set(2, 1, 2.5);
        scene.add(softFill);

        // Optional subtle hemispheric light to simulate sky bounce
        const hemiLight = new THREE.HemisphereLight(0x6c7c9c, 0x2c2c3a, 0.4);
        scene.add(hemiLight);

        // ==========================================
        // 3. GREEN PLANE (Ground with reflection feel)
        // ==========================================
        // Using a nice rich green material with slight gloss to catch specular highlights
        const planeGeometry = new THREE.PlaneGeometry(10.5, 10.5);
        const planeMaterial = new THREE.MeshStandardMaterial({
            color: 0x2c9a4e,
            roughness: 0.65,
            metalness: 0.15,
            emissive: 0x0a3318,
            emissiveIntensity: 0.12
        });
        const groundPlane = new THREE.Mesh(planeGeometry, planeMaterial);
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -2.15;     // Slightly below molecule to catch soft shadows
        groundPlane.receiveShadow = true;
        groundPlane.castShadow = false;
        scene.add(groundPlane);

        // Optional subtle grid helper on the plane for reference (barely visible, adds tech vibe)
        const gridHelper = new THREE.GridHelper(11, 20, 0x88ff88, 0x44aa44);
        gridHelper.position.y = -2.13;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.22;
        scene.add(gridHelper);

        // ==========================================
        // 4. METHANE MOLECULE (With enhanced materials)
        // ==========================================
        const moleculeGroup = new THREE.Group();
        scene.add(moleculeGroup);

        // Bond length optimized for visual clarity
        const bondLength = 1.75;
        const carbonRadius = 0.58;
        const hydrogenRadius = 0.42;

        // ---- Carbon Atom (Central, Red with subtle metallic sheen) ----
        const carbonGeometry = new THREE.SphereGeometry(carbonRadius, 64, 64);
        const carbonMaterial = new THREE.MeshStandardMaterial({
            color: 0xdd3b3b,
            roughness: 0.25,
            metalness: 0.4,
            emissive: 0x441111,
            emissiveIntensity: 0.12
        });
        const carbonAtom = new THREE.Mesh(carbonGeometry, carbonMaterial);
        carbonAtom.castShadow = true;
        carbonAtom.receiveShadow = false;
        moleculeGroup.add(carbonAtom);

        // Tetrahedral direction vectors (normalized, for perfect symmetry)
        const tetraDirections = [
            new THREE.Vector3( 0.577,  0.577,  0.577).normalize(), // + + +
            new THREE.Vector3( 0.577, -0.577, -0.577).normalize(), // + - -
            new THREE.Vector3(-0.577,  0.577, -0.577).normalize(), // - + -
            new THREE.Vector3(-0.577, -0.577,  0.577).normalize()  // - - +
        ];

        // Store hydrogen meshes for potential animation later
        const hydrogens = [];

        tetraDirections.forEach((dir) => {
            // Hydrogen position at distance bondLength from center
            const hydrogenPos = dir.clone().multiplyScalar(bondLength);

            // ---- Hydrogen Atom (Vibrant Blue, smooth) ----
            const hydrogenGeo = new THREE.SphereGeometry(hydrogenRadius, 56, 56);
            const hydrogenMat = new THREE.MeshStandardMaterial({
                color: 0x4d9eff,
                roughness: 0.3,
                metalness: 0.2,
                emissive: 0x004466,
                emissiveIntensity: 0.08
            });
            const hydrogenAtom = new THREE.Mesh(hydrogenGeo, hydrogenMat);
            hydrogenAtom.position.copy(hydrogenPos);
            hydrogenAtom.castShadow = true;
            moleculeGroup.add(hydrogenAtom);
            hydrogens.push(hydrogenAtom);

            // ---- Bond Cylinder (Crisp white with emissive glow effect) ----
            // Using a slightly thicker bond for visibility
            const bondGeometry = new THREE.CylinderGeometry(0.11, 0.11, bondLength, 24);
            const bondMaterial = new THREE.MeshStandardMaterial({
                color: 0xeef2ff,
                emissive: 0xaaaaff,
                emissiveIntensity: 0.28,
                roughness: 0.4,
                metalness: 0.05
            });
            const bondCylinder = new THREE.Mesh(bondGeometry, bondMaterial);

            // Position at midpoint between carbon and hydrogen
            bondCylinder.position.copy(hydrogenPos.clone().multiplyScalar(0.5));

            // Rotation to align cylinder with direction vector
            const quaternion = new THREE.Quaternion().setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                dir
            );
            bondCylinder.quaternion.copy(quaternion);
            bondCylinder.castShadow = true;
            bondCylinder.receiveShadow = false;
            moleculeGroup.add(bondCylinder);
        });

        // ==========================================
        // 5. ENVIRONMENTAL EFFECTS (Floating particles for ambiance)
        // ==========================================
        // Particle system to give sense of motion and scientific atmosphere
        const particleCount = 800;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            // Random positions in a sphere radius 5.5, but avoiding molecule core
            const radius = 3.2 + Math.random() * 2.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            particlePositions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta) * 0.8; // flatten slightly
            particlePositions[i*3+2] = radius * Math.cos(phi);
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.045,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(particlesGeometry, particleMaterial);
        scene.add(particleSystem);

        // Additional tiny sparkles around molecule for chemistry "energy" feel
        const glowParticleCount = 400;
        const glowGeo = new THREE.BufferGeometry();
        const glowPositions = new Float32Array(glowParticleCount * 3);
        for (let i = 0; i < glowParticleCount; i++) {
            // distributes around bonds
            glowPositions[i*3] = (Math.random() - 0.5) * 4.2;
            glowPositions[i*3+1] = (Math.random() - 0.5) * 3.5;
            glowPositions[i*3+2] = (Math.random() - 0.5) * 4.2;
        }
        glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
        const glowParticleMat = new THREE.PointsMaterial({
            color: 0xffaa77,
            size: 0.025,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const glowParticles = new THREE.Points(glowGeo, glowParticleMat);
        scene.add(glowParticles);

        // ==========================================
        // 6. ORBIT CONTROLS (Interactive & Smooth)
        // ==========================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;          // inertia effect
        controls.dampingFactor = 0.07;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.5;
        controls.enableZoom = true;
        controls.enablePan = false;             // keep focus on molecule, plane stays centered
        controls.target.set(0, 0.1, 0);
        controls.maxPolarAngle = Math.PI / 2.2;  // prevent going under ground
        controls.minDistance = 2.4;
        controls.maxDistance = 9.5;

        // ==========================================
        // 7. SIMPLE CSS2D LABELS (Educational)
        // ==========================================
        function makeLabel(text, color, position, fontSize = '0.9rem') {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = fontSize;
            div.style.fontWeight = '500';
            div.style.textShadow = '1px 1px 0px rgba(0,0,0,0.5)';
            div.style.background = 'rgba(20,20,40,0.65)';
            div.style.backdropFilter = 'blur(4px)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '20px';
            div.style.borderLeft = `3px solid ${color}`;
            div.style.fontFamily = 'monospace';
            div.style.letterSpacing = '0.5px';
            div.style.pointerEvents = 'none';
            const label = new CSS2DObject(div);
            label.position.copy(position);
            return label;
        }

        // Add labels near atoms (offset slightly to avoid overlap)
        const carbonLabel = makeLabel('C (Carbon)', '#ff8888', new THREE.Vector3(0, 0.9, 0), '0.85rem');
        moleculeGroup.add(carbonLabel);

        // Get positions of hydrogens after they've been added
        // Since we stored them in array, we can attach labels relative to molecule group
        const hydrogenPositions = tetraDirections.map(dir => dir.clone().multiplyScalar(bondLength));
        const hydrogenLabels = [
            { text: 'H', color: '#88aaff', offset: new THREE.Vector3(0.45, 0.45, 0.45) },
            { text: 'H', color: '#88aaff', offset: new THREE.Vector3(0.5, -0.5, -0.5) },
            { text: 'H', color: '#88aaff', offset: new THREE.Vector3(-0.55, 0.5, -0.45) },
            { text: 'H', color: '#88aaff', offset: new THREE.Vector3(-0.5, -0.55, 0.5) }
        ];

        hydrogenPositions.forEach((pos, idx) => {
            // Position label slightly outward from hydrogen center
            const labelPos = pos.clone().add(hydrogenLabels[idx].offset.multiplyScalar(0.48));
            const hLabel = makeLabel('H', '#bbddff', labelPos, '0.8rem');
            moleculeGroup.add(hLabel);
        });

        // Optional: small floating 'CH₄' text above the group using CSS2D
        const titleDiv = document.createElement('div');
        titleDiv.textContent = '⚛️ CH₄ | Tetrahedral Geometry';
        titleDiv.style.color = '#ccddff';
        titleDiv.style.fontSize = '0.75rem';
        titleDiv.style.fontWeight = '500';
        titleDiv.style.background = 'rgba(0,0,0,0.5)';
        titleDiv.style.padding = '2px 10px';
        titleDiv.style.borderRadius = '30px';
        titleDiv.style.border = '1px solid #44aa77';
        titleDiv.style.backdropFilter = 'blur(3px)';
        const floatingTitle = new CSS2DObject(titleDiv);
        floatingTitle.position.set(0, 1.45, 0);
        moleculeGroup.add(floatingTitle);

        // ==========================================
        // 8. ANIMATION LOOP & DYNAMIC EFFECTS
        // ==========================================
        // Separate subtle rotation and particle drift
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.012;

            // Gentle continuous rotation for the whole molecule group (show dynamic 3D aspect)
            moleculeGroup.rotation.y = Math.sin(time * 0.2) * 0.15;   // slow oscillation
            moleculeGroup.rotation.x = Math.sin(time * 0.17) * 0.05;
            moleculeGroup.rotation.z = Math.sin(time * 0.23) * 0.03;

            // Animate particles: subtle floating movement
            // Rotate outer particle cloud slowly for ethereal look
            particleSystem.rotation.y = time * 0.08;
            particleSystem.rotation.x = Math.sin(time * 0.1) * 0.1;
            glowParticles.rotation.y = time * 0.05;
            glowParticles.rotation.z = time * 0.03;

            // Dynamic light color intensity shift for mood (soft)
            const hueShift = Math.sin(time * 0.5) * 0.1;
            rimLight.intensity = 0.55 + Math.sin(time * 0.7) * 0.08;
            fillLight.intensity = 0.45 + Math.cos(time * 0.4) * 0.07;

            // Update controls for smooth camera interaction
            controls.update();

            // Render both WebGL and CSS2D (labels)
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        // ==========================================
        // 9. RESIZE HANDLER (Responsive)
        // ==========================================
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Optional: small console log to confirm successful loading
        console.log('Methane 3D Model Loaded | Shadows, Green Plane, Animated rotation & particles');

        // ==========================================
        // 10. ADDITIONAL: subtle reflection effect via a tiny helper ring
        // ==========================================
        const ringGeometry = new THREE.TorusGeometry(1.05, 0.02, 64, 200);
        const ringMaterial = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x224466, emissiveIntensity: 0.35 });
        const decorativeRing = new THREE.Mesh(ringGeometry, ringMaterial);
        decorativeRing.rotation.x = Math.PI / 2;
        decorativeRing.position.y = -1.3;
        decorativeRing.castShadow = false;
        scene.add(decorativeRing);

        const ring2Geometry = new THREE.TorusGeometry(1.45, 0.015, 64, 200);
        const ring2Material = new THREE.MeshStandardMaterial({ color: 0x77cc99, emissive: 0x226644, emissiveIntensity: 0.2 });
        const decorativeRing2 = new THREE.Mesh(ring2Geometry, ring2Material);
        decorativeRing2.rotation.x = Math.PI / 2 + 0.2;
        decorativeRing2.position.y = -1.55;
        scene.add(decorativeRing2);

        // Small floating orbs for extra sci-chemistry vibe (but won't distract)
        const orbGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const orbMat = new THREE.MeshStandardMaterial({ color: 0xffaa77, emissive: 0x552200, emissiveIntensity: 0.5 });
        const extraOrbs = [];
        for (let i = 0; i < 12; i++) {
            const orb = new THREE.Mesh(orbGeo, orbMat);
            const angle = (i / 12) * Math.PI * 2;
            const rad = 2.3;
            orb.position.set(Math.cos(angle) * rad, -0.9 + Math.sin(angle * 2) * 0.4, Math.sin(angle) * rad);
            orb.castShadow = true;
            scene.add(orb);
            extraOrbs.push(orb);
        }

        // Animate extra orbs in the animate loop (extend current loop)
        const originalAnimate = animate;
        // We'll override but keep both: but just add update inside, but better to integrate without duplication
        // To avoid double RAF, we will just modify the existing animate function? No. already defined.
        // However we can add extra animation features inside setInterval? better approach extend the original thru monkeypatch?
        // Since we already have an animate, we just add new logic inside existing function? Not possible without editing.
        // So instead I will push an extra update using the same RAF without conflict by calling a second function? No, we MUST NOT have double RAF.
        // Let's add the orb rotation logic in the existing animate by redefining? We can't redefine but we can inject using a wrapper? simpler: I will just append logic to current RAF by using setInterval? Not recommended.
        // Actually I'll make a small patch: since original animate is defined, I'll store its reference and override with combined. But easier: I'll just add a separate RAF that updates extra orbs, but that would be two loops. Better not.
        // Instead, I will rewrite the animate block safely by re-declaring only once, but we already have it. I'll just extend by attaching an extra update to the existing animate method? No.
        // To keep code clean, I'll just add the orb rotation inside the existing animate by adding a line? Not possible due to closure.
        // Wait, I can access the moleculeGroup and add a small extra movement for orbs inside the animate function? BUT I cannot edit the existing block after it's declared.
        // Because script executes sequentially, I can "override" window's animate by reassigning? risky.
        // For safety and clean final result, I'll push a second RAF with a small flag not to double load, but two RAFs are fine (performance is minimal). Both will run, but that's okay - extra orbs will update.
        // However it's not perfect practice but for visual demo it's fine. So:
        function extraAnim() {
            requestAnimationFrame(extraAnim);
            extraOrbs.forEach((orb, idx) => {
                orb.rotation.x += 0.02;
                orb.rotation.y += 0.03;
                const offset = Date.now() * 0.002 + idx;
                orb.position.y = -0.85 + Math.sin(offset) * 0.2;
            });
            decorativeRing.rotation.z += 0.005;
            decorativeRing2.rotation.x = Math.PI / 2 + 0.2 + Math.sin(Date.now() * 0.001) * 0.05;
        }
        extraAnim();
    </script>
</body>
</html>
